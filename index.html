<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第一个 GitHub 项目</title>
<style>
  :root{
    --ink:#1a1d21; --sub:#5b6470; --line:#e3e6ea; --bg:#f6f7f9; --card:#fff;
    --brand:#2b6cb0; --ok:#1a7f37; --ok-soft:#eaf6ec;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--ink);padding:24px;
       font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:40px 44px;max-width:560px;width:100%;text-align:center;
        box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 32px -12px rgba(16,24,40,.12)}
  .badge{display:inline-flex;align-items:center;gap:7px;background:var(--ok-soft);color:var(--ok);
         font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;margin-bottom:22px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  h1{margin:0 0 12px;font-size:25px;letter-spacing:.3px}
  p{margin:0 0 10px;color:var(--sub);font-size:14.5px;line-height:1.75}
  code{background:#f1f4f8;color:#1d4d80;padding:2px 6px;border-radius:5px;
       font-family:Consolas,"Courier New",monospace;font-size:13px}
  .foot{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);
        font-size:12.5px;color:#8b94a0}
</style>
</head>
<body>
  <div class="card">
    <div class="badge"><span class="dot"></span>推送成功</div>
    <h1>这是一个真实的 GitHub 仓库</h1>
    <p>你正在看的这个页面，就是从本地提交、推送到 GitHub 上来的。</p>
    <p>修改本文件任意一行 → <code>git add</code> → <code>git commit</code> → <code>git push</code>，再刷新网页就能看到变化。</p>
    <div class="foot">repo: 1653176354/my-repo</div>
  </div>
</body>
</html>
